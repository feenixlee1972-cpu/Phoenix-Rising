name: Build Phoenix Rises APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Package web app into Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html

      - name: Validate required Android assets
        run: |
          test -s android/app/src/main/assets/index.html
          test -s android/app/src/main/assets/enhancements.js
          test -s android/app/src/main/assets/payout_currency.js
          test -s android/app/src/main/AndroidManifest.xml
          test -s android/app/src/main/java/com/phoenixrises/app/MainActivity.java

      - name: Build debug APK
        run: gradle -p android assembleDebug --stacktrace

      - name: Package complete source backup
        run: |
          mkdir -p release-bundle
          cp -R android release-bundle/android
          cp -R .github release-bundle/.github
          cp index.html README.md release-bundle/
          cp -R docs release-bundle/docs 2>/dev/null || true
          cp -R android/app/src/main/assets release-bundle/assets
          (cd release-bundle && zip -r ../Phoenix-Rises-source-backup.zip .)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Phoenix-Rises-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload complete source backup
        uses: actions/upload-artifact@v4
        with:
          name: Phoenix-Rises-complete-source-backup
          path: Phoenix-Rises-source-backup.zip
          if-no-files-found: error
