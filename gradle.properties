# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE are ignored when building from the command line.
# For more details on how to configure your build environment visit
# http://www.gradle.org/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for headless machines. See also
# http://forums.gradle.org/gradle/topics/daemon_is_extremely_memory_hungry_on_solaris
org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/userguide/multi_project_builds/#sec:decoupled_projects
org.gradle.parallel=true
# AndroidX package structure to make it clearer which packages are being used in
# your project.
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and does nothing about the resources declared
# in the library's dependencies,
android.nonTransitiveRClass=true
